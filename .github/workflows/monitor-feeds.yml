name: Monitor Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes

permissions:
  contents: read

jobs:
  check-feeds:
    name: Check feed endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Probe feed endpoints
        run: npx tsx script/monitor-feeds.ts
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
