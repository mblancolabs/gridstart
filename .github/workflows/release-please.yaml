name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - name: Write calendar feeds config
        if: ${{ steps.release.outputs.release_created }}
        env:
          FEEDS_JSON: ${{ secrets.CALENDAR_FEEDS_LOCAL_JSON }}
        run: |
          if [ -n "$FEEDS_JSON" ]; then
            node -e "require('fs').writeFileSync('config/calendar-feeds.local.json', process.env.FEEDS_JSON)"
          fi

      - name: Build worker
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build:worker

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.release.outputs.release_created }}
        run: npx wrangler pages deploy dist --branch main --project-name ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
