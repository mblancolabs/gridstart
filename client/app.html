<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>GridStart — Motorsport Calendar</title>
    <meta
      name="description"
      content="Track every motorsport series in one calendar. F1, MotoGP, WEC, NASCAR, and more."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <style>
      .cookie-notice {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 999;
        padding: 0.5rem 1rem;
        font-size: 0.75rem;
        color: #8a8885;
        text-align: center;
        background: color-mix(in oklch, #09090b 85%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid oklch(from #e8e6e3 l c h / 0.06);
        letter-spacing: 0.04em;
        margin: 0;
        line-height: 1.5;
      }
    </style>

  <body>
    <div id="root"></div>
    <p class="cookie-notice">
      This site uses a cookie for security and one to remember your series preferences.
    </p>
    <script type="module" src="/src/main.tsx"></script>
